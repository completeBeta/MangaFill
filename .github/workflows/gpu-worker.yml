name: Publish GPU worker images

# Builds the four Manga Fill GPU worker images and pushes them to GitHub
# Container Registry (ghcr.io). Runs on every `v*` tag push, or manually.
#
# Users then pull straight from Unraid / any Docker host without building:
#   docker pull ghcr.io/completebeta/manga-fill-gpu:latest   # NVIDIA RTX 20/30/40/50
#   docker pull ghcr.io/completebeta/manga-fill-gpu:pascal   # NVIDIA P2000 / GTX 10
#   docker pull ghcr.io/completebeta/manga-fill-gpu:rocm     # AMD RX 6000/7000/9000
#   docker pull ghcr.io/completebeta/manga-fill-gpu:cpu      # no GPU
#
# NOTE: the images are large (CUDA ~5 GB, ROCm ~9 GB). The ROCm build is the
# heaviest and may need a larger runner if it runs out of disk. Builds run
# fail-fast: false so one variant failing doesn't block the rest.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/completebeta/manga-fill-gpu

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            tag: latest
          - dockerfile: Dockerfile.pascal
            tag: pascal
          - dockerfile: Dockerfile.rocm
            tag: rocm
          - dockerfile: Dockerfile.cpu
            tag: cpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          FLOAT="${{ env.IMAGE }}:${{ matrix.tag }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tags=${FLOAT},${{ env.IMAGE }}:${{ matrix.tag }}-v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${FLOAT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: gpu-worker
          file: gpu-worker/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
