services:
  mangafill:
    build: .
    container_name: mangafill
    ports:
      - "8788:8788"
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./uploads:/input
      - ./config:/app/config
      - ./hf-cache:/root/.cache/huggingface   # persist downloaded models (manga-ocr, detector, LaMa)
      - ./paddlex-cache:/root/.paddlex        # persist PaddleOCR models (ko/zh PP-OCRv5/v6)
    restart: unless-stopped
