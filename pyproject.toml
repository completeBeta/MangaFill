[project]
name = "manga-fill"
version = "0.20.0"
description = "Translate raw Japanese manga to English — detect → OCR → translate → inpaint → typeset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Heavy ML deps (pull torch — install torch CPU-only separately, see Dockerfile).
ml = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.49",            # RT-DETR-v2 detector (ogkalu)
    "manga-ocr>=0.1.16",
    "paddleocr>=3.0",                 # PP-OCRv5_server_det fallback (ONNX via onnxruntime)
    "onnxruntime>=1.16",
    "easyocr>=1.7",                   # Korean + Chinese OCR (multi-language input)
    "opencv-python-headless>=4.8,<5.0",  # cv2 for detection + easyocr (headless: easyocr's dep)
    "numpy<2.0",                      # paddlex + simple-lama-inpainting need numpy 1.x
    # simple-lama-inpainting is deliberately NOT listed: its `pillow<10` +
    # `numpy<2` metadata pins are stale and conflict with manga-ocr's
    # `pillow>=10`. Install it separately with `--no-deps` (see Dockerfile).
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.pipeline", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
