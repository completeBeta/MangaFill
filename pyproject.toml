[project]
name = "manga-fill"
version = "0.1.0"
description = "Translate raw Japanese manga to English — detect → OCR → translate → inpaint → typeset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Heavy ML deps are added per-milestone (they pull torch, large + slow to build):
#   Milestone 2 (detect + OCR): manga-ocr, torch, torchvision
#   Milestone 4 (inpaint):       lama-cleaner (or opencv + lama weights)
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.pipeline", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
